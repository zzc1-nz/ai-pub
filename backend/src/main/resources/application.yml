server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-pub

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:mysql://localhost:3307/ai_pub?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  jpa:
    hibernate:
      ddl-auto: update
    # SQL 日志默认关闭，本地排查时用 -Dspring.jpa.show-sql=true 或环境变量开启。
    # 生产环境长期开启会显著增加日志量并拖慢写入。
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
      timeout:
        # 连接超时 5s；读取超时 30s（大模型生成中文回复通常需要数秒，
        # 原先的 2s 会让绝大多数 AI 回复超时并降级为默认话术）
        connect: 5000
        read: 30000

# 素材/图片的本地存储目录（顶层配置，注意不要写在 spring: 块内部）。
# Docker 镜像内通过 APP_UPLOAD_DIR=/app/uploads 指定；本地开发默认 ./uploads，
# 避免在 Windows 上写到盘符根目录下的 app/uploads。
app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}

jwt:
  # 生产环境请通过环境变量 JWT_SECRET 覆盖（默认值随源码公开）
  secret: ${JWT_SECRET:ai-pub-secret-key-2024-for-jwt-token-generation}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ai-pub

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.ai.pub.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.ai.pub: debug