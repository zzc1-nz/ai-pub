apiVersion: 1

datasources:
  - name: Prometheus
    # uid 必须与 grafana-dashboards/ai-pub-jvm.json 中各面板引用的
    # "datasource": {"type":"prometheus","uid":"prometheus"} 一致。
    # 不显式指定时 Grafana 会随机生成 uid，导致所有面板报
    # "Datasource prometheus was not found"。
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
